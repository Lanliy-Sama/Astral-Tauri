<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icons/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2196F3" />
    <title>Astral</title>
    <script>
      // 防止主题闪烁：启动前读取持久化的主题模式
      (function () {
        try {
          var raw = null;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.startsWith('astral-tauri-theme')) raw = localStorage.getItem(k);
          }
          var mode = 'system';
          if (raw) {
            try {
              var obj = JSON.parse(raw);
              if (obj && obj.state && obj.state.themeMode != null) mode = obj.state.themeMode;
            } catch (e) {}
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme-mode', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

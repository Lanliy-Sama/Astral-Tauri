[package]
name = "astral-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Astral 网络核心（复用自原 Flutter 版 rust/ crate，移除 flutter_rust_bridge 绑定）"

[lib]
crate-type = ["lib"]

[dependencies]
lazy_static = "1.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19.0"
dashmap = "6.1.0"
chrono = "0.4.41"
humansize = "1.1.1"
tokio = { version = "1.39.2", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0.95"
stun_codec = "0.3"
bytecodec = "0.4"
rand = "0.8"
surge-ping = "0.8"
uuid = { version = "1.0", features = ["v4"] }

# EasyTier 内核：使用本仓 Easytier 分支的 vendored fork（上游 main @ 3b32aaff
# 锁定 rev，仅含构建闭包 crate，消除 branch=main 浮动解析）。实例层
# InstanceManager/CoreInstance + management feature 用法不变。
easytier = { git = "https://github.com/Lanliy-Sama/Astral-Tauri", branch = "Easytier", default-features = false, features = ["wireguard", "websocket", "quic", "tun", "smoltcp", "socks5", "kcp", "faketcp", "magic-dns", "zstd", "management"] }
easytier-core = { git = "https://github.com/Lanliy-Sama/Astral-Tauri", branch = "Easytier", default-features = false }
# 锁 rust-i18n 全家桶到上游 lock 的自洽组合（4.2.2/4.2.2/4.2.2）：
# 全新解析会混选出 rust-i18n-macro 4.0.0 + rust-i18n-support 4.2.4，
# 而宏期望的 load_locales/I18nConfig 在 4.2.x support 里被挪到
# codegen feature 门后 → E0432 编译失败（首轮 CI 实测）。
rust-i18n = "=4.2.2"
elevated-command = "1.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
    "Win32_System_WindowsProgramming",
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Rpc",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Console"
] }
ipnetwork = "0.20"
widestring = { version = "1.0.2", default-features = false, features = ["alloc"] }
winapi = { version = "0.3.9", features = [
    "iphlpapi",
    "winerror",
    "errhandlingapi",
    "minwindef",
    "ws2def",
    "iptypes",
    "ipifcons",
    "heapapi",
    "processthreadsapi",
    "fileapi",
    "winnt",
    "handleapi",
    "winbase",
    "ntdef",
    "winuser"
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# 代码生成后端：Cranelift 替换 LLVM（nightly + rustc-codegen-cranelift-preview）
# 按目标显式声明（RUSTFLAGS env 会覆盖 config，故不使用 [build] 段）
[target.x86_64-pc-windows-msvc]
rustflags = ["-Zcodegen-backend=cranelift"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zcodegen-backend=cranelift"]

# Android 16KB 内存页对齐：2024+ 部分新机型（Android 15+/16 时代）
# 内核为 16KB-only 页，4KB 对齐的动态库在这些设备上 dlopen 直接失败
# —— 表现为应用启动即闪退。16KB 对齐对 4KB 页设备完全向后兼容。
[target.aarch64-linux-android]
rustflags = [
    "-Zcodegen-backend=cranelift",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

[target.armv7-linux-androideabi]
rustflags = [
    "-Zcodegen-backend=cranelift",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

[target.i686-linux-android]
rustflags = [
    "-Zcodegen-backend=cranelift",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

[target.x86_64-linux-android]
rustflags = [
    "-Zcodegen-backend=cranelift",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
]

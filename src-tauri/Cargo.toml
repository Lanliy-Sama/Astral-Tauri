[package]
name = "astral"
version = "2.9.60"
description = "Astral - 基于 EasyTier 的跨平台 P2P 网络应用（Tauri + Svelte 5 版）"
authors = ["Astral"]
edition = "2021"

[lib]
name = "astral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = ["tray-icon", "devtools"] }
tauri-plugin-sql = { version = "3.0.0-alpha.3", features = ["sqlite"] }
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-deep-link = "3.0.0-alpha.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 自定义背景：分块 base64 解码（流式写盘）+ astralbg:// 协议响应类型
base64 = "0.22"
http = "1"
# 背景音乐文件 uuid 命名（bgm_write_begin 生成）
uuid = { version = "1.0", features = ["v4"] }

# 网络核心：直接复用原 Flutter 版的 rust/ crate（已移除 flutter_rust_bridge 绑定）
astral-core = { path = "crates/astral-core" }

# v3 起 tauri 不再传递依赖 tauri-runtime-wry：
# - Android 的 mobile_entry_point 宏仍展开为 ::tauri_runtime_wry::android_binding!
# - 桌面端需显式 .runtime(tauri_runtime_wry::Wry::default())
tauri-runtime-wry = "3.0.0-alpha.6"

# Android VpnService 桥接（其他平台为返回「不支持」的空实现）
tauri-plugin-vpn-service = { path = "../vpn-service-plugin" }

# 音乐平台直连（网易云 / QQ / 酷狗）：扫码登录 + 搜索 + 播放地址 + 歌词
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "json", "blocking", "cookies"] }
aes = "0.8"
num-bigint = "0.4"
md-5 = "0.10"
qrcode = "0.14"
rand = "0.8"
regex = "1"

# Windows 单实例互斥（修「关闭主界面后任务栏两个图标」）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# QQ 扫码 MQTT/WS 登录通道（桌面端专用）：native-tls 在非 Windows/macOS
# 走 openssl-sys，Android 交叉编译无 OpenSSL sysroot，故按目标平台门控；
# Android 上 QQ 登录入口会明确提示使用桌面版
[target.'cfg(not(target_os = "android"))'.dependencies]
native-tls = "0.2"
sha1 = "0.10"
# 系统媒体控制：Windows SMTC / Linux MPRIS / macOS Now Playing
souvlaki = "0.9.3"

[profile.release]
# Cranelift 后端：LTO 是 LLVM bitcode 专属，必须关闭；
# opt-level = "s" → cg_clif 映射 Cranelift opt_level=speed_and_size
# （lib.rs: OptLevel::Size/SizeMin → speed_and_size；此前 3=Aggressive 不设任何档）
codegen-units = 1
lto = false
opt-level = "s"
panic = "abort"
strip = true

# Cranelift 兼容补丁：serde_json ≥1.0.147 的浮点格式化后端 zmij 内部使用
# SSE2/NEON intrinsic（_mm_mulhi_epu16 等），rustc_codegen_cranelift 会把其中
# 多个编译成运行时陷阱（issue #171）——连接房间首次解析 JSON 数字即
# panic=abort 静默退出。重定向到 Easytier 分支里打补丁的标量版 zmij fork。
[patch.crates-io]
zmij = { git = "https://github.com/Lanliy-Sama/Astral-Tauri", branch = "Easytier" }

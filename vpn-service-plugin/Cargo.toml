[package]
name = "tauri-plugin-vpn-service"
version = "0.1.0"
description = "Android VpnService bridge for Astral"
edition = "2021"
links = "tauri-plugin-vpn-service"
build = "build.rs"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

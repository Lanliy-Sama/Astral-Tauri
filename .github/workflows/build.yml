name: 🚀 构建 Astral（全平台）

# Windows / Linux / Android 在 push 时构建；macOS / iOS 在 build-apple.yml 单独构建。
# 也可被 release.yml 通过 workflow_call 复用（传入 version 覆盖应用版本号）。
on:
  workflow_call:
    inputs:
      version:
        description: '覆盖应用版本号（发布构建用）'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖应用版本号（留空使用仓库默认）'
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - Tauri3

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 桌面：Windows + Linux ----------------
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            bundles: nsis
            artifact: astral-windows-x64
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage

    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🦀 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 📦 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            file

      - name: 📦 安装 protoc（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Ubuntu 22.04 自带的 protoc 3.12 不支持 proto3 optional，安装官方新版
          PB_VERSION=27.3
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: 📦 安装 protoc（Windows）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: 📦 安装 Npcap SDK（Windows 链接 Packet.lib / wpcap.lib）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $sdkVer = "1.16"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$sdkVer.zip" -OutFile $zip
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib not found in: $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib not found in: $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $append = {
            param([string]$Line)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Line`n", $utf8NoBom)
          }
          & $append "LIB=$libDir;$env:LIB"
          & $append "NPCAP_SDK_LIB=$libDir"
          Write-Host "Npcap SDK 已配置：$libDir"

      - name: 📥 安装 npm 依赖
        run: npm install --no-audit --no-fund

      - name: 🖼️ 从原图重新生成图标（恢复圆角）
        run: npx tauri icon app-icon.png

      - name: 🧰 预热 NSIS 工具链（Windows，带重试防 GitHub 504）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .github/scripts/preheat-nsis.ps1

      - name: 🔨 构建 Tauri 应用
        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri build $CFG --bundles ${{ matrix.bundles }}

      - name: 📤 上传安装包（Windows）
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn
          retention-days: 14

      # Linux 拆成两个 artifact：deb 约 21 MB，AppImage 约 95 MB（自带 WebKitGTK）
      - name: 📤 上传 deb（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: astral-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: 📤 上传 AppImage（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: astral-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  # ---------------- Android ----------------
  android:
    name: android-arm64
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 安装 Android NDK
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          NDK_VER=27.0.12077973
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;$NDK_VER"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          # kcp-sys 等 C 依赖通过 bindgen 生成绑定时需要 NDK sysroot 头文件
          SYSROOT="$ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT --target=aarch64-linux-android24" >> $GITHUB_ENV

      - name: 🦀 安装 Rust 与 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: 📦 安装 protoc（需新版支持 proto3 optional）
        run: |
          PB_VERSION=27.3
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: 📥 安装 npm 依赖
        run: npm install --no-audit --no-fund

      # gen/ 每次全新生成：init 之前必须先用原图重出图标，
      # 否则 APK 启动器图标是 Tauri 默认图标（桌面 job 有同款步骤）
      - name: 🖼️ 重新生成图标（Android 启动器图标）
        run: npx tauri icon app-icon.png

      - name: 🏗️ 初始化 Android 工程
        run: npx tauri android init --ci

      - name: 🔨 构建 APK（arm64-v8a）
        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri android build --ci $CFG --apk --target aarch64

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: astral-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

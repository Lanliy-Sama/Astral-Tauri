name: 馃殌 鏋勫缓 Astral锛堝叏骞冲彴锛?
# Windows / Linux / Android / macOS / iOS 鍏ㄩ儴鍦?push 鏃舵瀯寤猴紱
# 涔熷彲琚?release.yml 閫氳繃 workflow_call 澶嶇敤锛堜紶鍏?version 瑕嗙洊搴旂敤鐗堟湰鍙凤級銆?on:
  workflow_call:
    inputs:
      version:
        description: '瑕嗙洊搴旂敤鐗堟湰鍙凤紙鍙戝竷鏋勫缓鐢級'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: '瑕嗙洊搴旂敤鐗堟湰鍙凤紙鐣欑┖浣跨敤浠撳簱榛樿锛?
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - Tauri3

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 妗岄潰锛歐indows + Linux ----------------
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            bundles: nsis
            artifact: astral-windows-x64
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage

    steps:
      - name: 馃洜锔?妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 馃煝 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 馃 瀹夎 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 馃捑 缂撳瓨 Rust 鏋勫缓
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 馃摝 瀹夎 Linux 绯荤粺渚濊禆
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            file

      - name: 馃摝 瀹夎 protoc锛圠inux锛?        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Ubuntu 22.04 鑷甫鐨?protoc 3.12 涓嶆敮鎸?proto3 optional锛屽畨瑁呭畼鏂规柊鐗?          PB_VERSION=27.3
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: 馃摝 瀹夎 protoc锛圵indows锛?        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: 馃摝 瀹夎 Npcap SDK锛圵indows 閾炬帴 Packet.lib / wpcap.lib锛?        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $sdkVer = "1.16"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$sdkVer.zip" -OutFile $zip
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib not found in: $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib not found in: $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $append = {
            param([string]$Line)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Line`n", $utf8NoBom)
          }
          & $append "LIB=$libDir;$env:LIB"
          & $append "NPCAP_SDK_LIB=$libDir"
          Write-Host "Npcap SDK 宸查厤缃細$libDir"

      - name: 馃摜 瀹夎 npm 渚濊禆
        run: npm install --no-audit --no-fund

      - name: 馃柤锔?浠庡師鍥鹃噸鏂扮敓鎴愬浘鏍囷紙鎭㈠鍦嗚锛?        run: npx tauri icon app-icon.png

      - name: 馃敤 鏋勫缓 Tauri 搴旂敤
        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri build $CFG --bundles ${{ matrix.bundles }}

      - name: 馃摛 涓婁紶瀹夎鍖咃紙Windows锛?        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn
          retention-days: 14

      # Linux 鎷嗘垚涓や釜 artifact锛歞eb 绾?21 MB锛孉ppImage 绾?95 MB锛堣嚜甯?WebKitGTK锛?      - name: 馃摛 涓婁紶 deb锛圠inux锛?        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: astral-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: 馃摛 涓婁紶 AppImage锛圠inux锛?        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: astral-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  # ---------------- Android ----------------
  android:
    name: android-arm64
    runs-on: ubuntu-latest

    steps:
      - name: 馃洜锔?妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 馃煝 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 鈽?瀹夎 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 馃 瀹夎 Android NDK
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          NDK_VER=27.0.12077973
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;$NDK_VER"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          # kcp-sys 绛?C 渚濊禆閫氳繃 bindgen 鐢熸垚缁戝畾鏃堕渶瑕?NDK sysroot 澶存枃浠?          SYSROOT="$ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT --target=aarch64-linux-android24" >> $GITHUB_ENV

      - name: 馃 瀹夎 Rust 涓?Android 浜ゅ弶缂栬瘧鐩爣
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 馃捑 缂撳瓨 Rust 鏋勫缓
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: 馃摝 瀹夎 protoc锛堥渶鏂扮増鏀寔 proto3 optional锛?        run: |
          PB_VERSION=27.3
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip"
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: 馃摜 瀹夎 npm 渚濊禆
        run: npm install --no-audit --no-fund

      - name: 馃彈锔?鍒濆鍖?Android 宸ョ▼
        run: npx tauri android init --ci

      - name: 馃敤 鏋勫缓 APK锛坅rm64-v8a锛?        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri android build --ci $CFG --apk --target aarch64

      - name: 馃摛 涓婁紶 APK
        uses: actions/upload-artifact@v4
        with:
          name: astral-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  # ---------------- macOS锛堟墜鍔ㄨЕ鍙戯級 ----------------
  macos:
    name: macos-arm64
    if: vars.ENABLE_APPLE_BUILDS == 'true' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest

    steps:
      - name: 馃洜锔?妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 馃煝 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 馃 瀹夎 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 馃捑 缂撳瓨 Rust 鏋勫缓
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos

      - name: 馃摝 瀹夎 protoc
        run: |
          brew install protobuf
          protoc --version

      - name: 馃摜 瀹夎 npm 渚濊禆
        run: npm install --no-audit --no-fund

      - name: 馃柤锔?浠庡師鍥鹃噸鏂扮敓鎴愬浘鏍囷紙鎭㈠鍦嗚锛?        run: npx tauri icon app-icon.png

      - name: 馃敤 鏋勫缓搴旂敤
        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri build $CFG --bundles app,dmg --target aarch64-apple-darwin

      - name: 馃摛 涓婁紶 dmg
        uses: actions/upload-artifact@v4
        with:
          name: astral-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

  # ---------------- iOS锛堟墜鍔ㄨЕ鍙戯級 ----------------
  ios:
    name: ios-sim
    if: vars.ENABLE_APPLE_BUILDS == 'true' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest

    steps:
      - name: 馃洜锔?妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 馃煝 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 馃 瀹夎 Rust 涓?iOS 鐩爣
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 馃捑 缂撳瓨 Rust 鏋勫缓
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 馃摝 瀹夎 protoc
        run: |
          brew install protobuf
          protoc --version

      - name: 馃摜 瀹夎 npm 渚濊禆
        run: npm install --no-audit --no-fund

      - name: 馃彈锔?鍒濆鍖?iOS 宸ョ▼
        run: npx tauri ios init --ci

      - name: 馃敤 鏋勫缓妯℃嫙鍣ㄥ寘锛堟湭绛惧悕锛?        run: npx tauri ios build --ci --target aarch64-sim

      - name: 馃摛 涓婁紶 .app
        uses: actions/upload-artifact@v4
        with:
          name: astral-ios-sim
          path: |
            src-tauri/gen/apple/**/*.app
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn
          retention-days: 14

name: 📱 构建 Android 应用 (Tauri)

# 说明：本工作流只验证 Android 端可编译并产出 APK。
# 当前 src-tauri/ 尚未集成 VpnService（见 src-tauri/mobile-reference/ 与 docs/MOBILE.md），
# 因此产出的 APK 可以启动 UI，但联网核心不可用，需按 docs/MOBILE.md 完成集成。

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 安装 Android SDK 与 NDK
        uses: android-actions/setup-android@v3

      - name: 📦 安装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: 🦀 安装 Rust 与 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: 📥 安装 npm 依赖
        run: npm ci

      - name: 🏗️ 初始化 Android 工程
        run: npx tauri android init --ci

      - name: 🔨 构建 APK（arm64-v8a）
        run: npx tauri android build --ci --apk --target aarch64

      - name: 📤 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: astral-android-arm64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

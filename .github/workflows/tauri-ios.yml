name: 🍎 构建 iOS 应用 (Tauri)

# 说明：使用模拟器目标 aarch64-sim 构建，无需签名/公证。
# 真机包需要 Apple 开发者证书，见 docs/MOBILE.md。
# 手动触发：每次 push 都跑 macOS 构建成本较高。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🦀 安装 Rust 与 iOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 📦 安装 protoc（easytier-proto 构建需要）
        run: |
          brew install protobuf
          protoc --version

      - name: 📥 安装 npm 依赖
        run: npm ci

      - name: 🏗️ 初始化 iOS 工程
        run: npx tauri ios init --ci

      - name: 🔨 构建模拟器包（arm64-sim，未签名）
        run: npx tauri ios build --ci --target aarch64-sim

      - name: 📤 上传 .app
        uses: actions/upload-artifact@v4
        with:
          name: astral-ios-sim
          path: |
            src-tauri/gen/apple/**/*.app
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn
          retention-days: 14

name: 🖥️ 构建桌面应用 (Tauri)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            bundles: nsis,msi
            artifact: astral-windows-x64
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage
            artifact: astral-linux-x64
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: macos-latest
            name: macos-arm64
            bundles: app,dmg
            artifact: astral-macos-arm64
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🦀 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 📦 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            file

      - name: 📦 安装 protoc（Linux，easytier-proto 构建需要）
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get install -y protobuf-compiler

      - name: 📦 安装 protoc（Windows，easytier-proto 构建需要）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: 📦 安装 protoc（macOS，easytier-proto 构建需要）
        if: matrix.platform == 'macos-latest'
        run: |
          brew install protobuf
          protoc --version

      - name: 📦 安装 Npcap SDK（Windows 链接 Packet.lib / wpcap.lib）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $sdkVer = "1.16"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$sdkVer.zip" -OutFile $zip
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib not found in: $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib not found in: $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $append = {
            param([string]$Line)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Line`n", $utf8NoBom)
          }
          & $append "LIB=$libDir;$env:LIB"
          & $append "NPCAP_SDK_LIB=$libDir"
          Write-Host "Npcap SDK 已配置：$libDir"

      - name: 📥 安装 npm 依赖
        run: npm ci

      - name: 🔨 构建 Tauri 应用
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}

      - name: 📤 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn
          retention-days: 14

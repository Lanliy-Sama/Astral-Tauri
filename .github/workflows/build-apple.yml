name: 🍎 构建 Astral（macOS / iOS）

# Apple 两端独立于 build.yml 的三平台构建；账号分配不到 macOS runner 时
# job 会被取消，continue-on-error 保证不阻断发布流程。
on:
  workflow_call:
    inputs:
      version:
        description: '覆盖应用版本号（发布构建用）'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖应用版本号（留空使用仓库默认）'
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - Tauri3

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4
      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 🦀 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos
      - name: 📦 安装 protoc
        run: |
          brew install protobuf
          protoc --version
      - name: 📥 安装 npm 依赖
        run: npm ci
      - name: 🖼️ 从原图重新生成图标（恢复圆角）
        run: npx tauri icon app-icon.png
      - name: 🔨 构建应用
        shell: bash
        run: |
          CFG=""
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
            CFG="--config $RUNNER_TEMP/version.json"
          fi
          npx tauri build $CFG --bundles app,dmg --target aarch64-apple-darwin
      - name: 📤 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: astral-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14

  ios:
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: 🛠️ 检出代码
        uses: actions/checkout@v4
      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 🦀 安装 Rust 与 iOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: 💾 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
      - name: 📦 安装 protoc
        run: |
          brew install protobuf
          protoc --version
      - name: 📥 安装 npm 依赖
        run: npm ci
      - name: 🖼️ 从原图重新生成图标（恢复圆角）
        run: npx tauri icon app-icon.png
      - name: 🏗️ 初始化 iOS 工程
        run: npx tauri ios init --ci
      - name: 🔨 构建模拟器包（未签名）
        run: npx tauri ios build --ci --target aarch64-sim
      - name: 📤 上传 .app
        uses: actions/upload-artifact@v4
        with:
          name: astral-ios-sim
          path: |
            src-tauri/gen/apple/**/*.app
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn
          retention-days: 14
